<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="header" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#229ed9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Card -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <!-- Calendar Top Bar -->
  <path d="M4 18 C4 11.37 9.37 6 16 6 L48 6 C54.63 6 60 11.37 60 18 L60 22 L4 22 Z" fill="url(#header)"/>

  <!-- Binder Rings -->
  <rect x="18" y="3" width="4" height="7" rx="2" fill="#ffffff" opacity="0.9"/>
  <rect x="42" y="3" width="4" height="7" rx="2" fill="#ffffff" opacity="0.9"/>

  <!-- Calendar Grid Dots -->
  <circle cx="18" cy="32" r="3.5" fill="#64748b"/>
  <circle cx="32" cy="32" r="3.5" fill="#64748b"/>
  <circle cx="46" cy="32" r="3.5" fill="#64748b"/>
  
  <circle cx="18" cy="45" r="3.5" fill="#64748b"/>

  <!-- Glowing Checkmark Circle -->
  <circle cx="39" cy="44" r="11" fill="#10b981" fill-opacity="0.25" filter="url(#glow)"/>
  <circle cx="39" cy="44" r="9" fill="url(#check)"/>
  <path d="M34.5 44 L37.5 47 L43.5 40.5" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
